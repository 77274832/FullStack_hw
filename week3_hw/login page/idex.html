<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: rgb(255, 238, 255);">
    <div class="login-box" style="background-color: rgb(255, 181, 223);">
        <h1>Login</h1>
        <form style="background-color: rgb(255, 181, 244);">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required>
            <button type="submit">Login</button>
        </form>
        <p>
            Don't have an account?
            <a href="#">Register</a>
        </p>
    </div>
</body>
</html>
